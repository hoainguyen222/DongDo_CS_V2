version: "2"
sql:
  # ============================================================
  # Auth domain — users, sessions
  # ============================================================
  - engine: "postgresql"
    queries: "db/queries/auth"
    schema: "db/migrations"
    gen:
      go:
        package: "authdb"
        out: "internal/repository/sqlcdb/auth"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_methods_with_db_argument: false
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.int4"
            go_type: "int32"
          - db_type: "user_role"
            go_type:
              import: "github.com/hoainguyen222/DongDo_CS_V2/internal/domain"
              type: "UserRole"
          - db_type: "case_status"
            go_type:
              import: "github.com/hoainguyen222/DongDo_CS_V2/internal/domain"
              type: "CaseStatus"
          - db_type: "sender_type"
            go_type:
              import: "github.com/hoainguyen222/DongDo_CS_V2/internal/domain"
              type: "SenderType"
          - db_type: "learn_status"
            go_type:
              import: "github.com/hoainguyen222/DongDo_CS_V2/internal/domain"
              type: "LearnStatus"
          - db_type: "call_status"
            go_type:
              import: "github.com/hoainguyen222/DongDo_CS_V2/internal/domain"
              type: "CallStatus"
          - db_type: "caller_type"
            go_type:
              import: "github.com/hoainguyen222/DongDo_CS_V2/internal/domain"
              type: "CallerType"

