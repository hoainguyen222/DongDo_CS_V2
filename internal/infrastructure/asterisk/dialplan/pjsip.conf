; ============================================================
; pjsip.conf — minimal PJSIP/WSS config for the call app.
; The Go service expects this file (or its content) to be mounted at
; /etc/asterisk/pjsip.conf inside the Asterisk container.
;
; NOTE: ARI HTTP settings (enabled, bindaddr, bindport) live in
; http.conf, NOT here. The old [general] block pasted here was ignored
; by PJSIP and caused the ARI server to never bind.
; ============================================================

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:5061
; Certificate paths inside the container
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ============================================================
; Endpoint template (per agent: agent-<username>)
; ============================================================

[agent-template](!)
type=endpoint
context=from-internal
allow=!all,ulaw,opus,vp8
webrtc=yes
dtls_auto_generate_cert=yes

auth=agent-auth
aors=agent-aor

[agent-auth]
type=auth
auth_type=authpwd
username={user}
password={password}

[agent-aor]
type=aor
max_contacts=1
remove_existing=yes

; ============================================================
; Concrete agent endpoints are registered dynamically from
; ARI POST /ari/endpoints when an agent logs in. See
; infrastructure/asterisk/ari_client.go for the API.
; ============================================================
