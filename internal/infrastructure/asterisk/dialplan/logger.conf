; ============================================================
; logger.conf — minimal log configuration.
;
; Without this file (or with an invalid one) Asterisk logs:
;   ERROR[...]: logger.c:2237 init_logger: Errors detected in logger.conf.
;   Default console logging is being used.
;
; We use only console logging so logs go to docker stdout (`docker logs`).
; File-based logging (logfiles) can be re-enabled for production with:
;   [logfiles]
;   messages => notice,warning,error,verbose
; ============================================================

[general]
; dateformat for easy parsing by log aggregators (e.g. filebeat, Loki).
dateformat=%F %T

; Log level for the console channel. Options: debug, notice, warning, error.
console_level = notice

[logfiles]
; Uncomment for file-based logging:
; messages => notice,warning,error,verbose,dtmf,fax
