; ============================================================
; modules.conf — autoload all modules.
;
; Without this file the loader refuses to start:
;   loader.c:2394 loader_config_init: 'modules.conf' invalid or missing.
;
; We use `autoload=yes` so Asterisk discovers all compiled modules under
; /usr/lib/asterisk/modules automatically. This is the same default that
; the andrius/asterisk:18 image ships, but we mount it explicitly because
; bind-mounting individual files (pjsip.conf, http.conf, ...) would otherwise
; hide the image's default modules.conf from /etc/asterisk.
;
; To disable a module in production add a `noload => mod/name.so` line below.
; ============================================================

[modules]
autoload=yes
