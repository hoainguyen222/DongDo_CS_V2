; ============================================================
; http.conf — Asterisk HTTP server.
;
; This binds the ARI (Asterisk REST Interface) endpoint to :8088 INSIDE
; the container. The Go backend talks to it on:
;
;   http://asterisk:8088/ari/{channels,bridges,...}
;
; using HTTP Basic Auth with ASTERISK_ARI_USER / ASTERISK_ARI_PASSWORD.
;
; Without this file ARI does NOT bind, the `module res_ari.so` is loaded
; but listens nowhere, and our Go ARI client (see ari_client.go) returns
; "asterisk unavailable" on every call.
;
; (The previous version accidentally pasted the [general] block at the
; bottom of pjsip.conf — which PJSIP silently ignores. ARI will fail to
; bind without an explicit http.conf.)
; ============================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
; TLS — not enabled in dev. For production add tlsenable=yes, tlsbindaddr,
; tlscertfile, tlsprivatekey.

; Cross-origin — the Go backend sits on the same docker network so this
; isn't strictly required, but enabling it makes tcpdump debugging easier.
prefix=
enablestatic=yes
redirect=/
sessionlimit=1000
session_inactivity=30000
session_keepalive=15000

; Real-time WebSocket settings (used by asterisk.ari_ws.go).
; TLS websocket is OFF in dev — the backend uses ws:// (not wss://).
; To turn on TLS, set tlsenable=yes below.
tlsenable=no
; tlscertfile=/etc/asterisk/keys/asterisk.pem
; tlsprivatekey=/etc/asterisk/keys/asterisk.key
