; ============================================================
; extensions.conf — dialplan for the call Stasis app.
; ============================================================

[general]
static=yes
writeprotect=no

[globals]

; ============================================================
; from-internal : customer + agent call paths
; ============================================================
[from-internal]
exten => _X.,1,NoOp(Incoming call to ${EXTEN})
 same => n,Stasis(callapp,${CALL_ID})
 same => n,Hangup()

; Catch-all
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Hangup()
