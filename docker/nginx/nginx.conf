user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # -------------------------------------------------------------------------
    # MIME & basic I/O
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Allow large request bodies (audio uploads for ASR).
    # Override per-deployment via the UPLOAD_LIMIT env var in the conf.d template.
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # -------------------------------------------------------------------------
    # gzip — compress text payloads to save bandwidth
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # -------------------------------------------------------------------------
    # WebSocket + proxy defaults
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Long timeouts for SSE / WS / long-running LLM streams
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Connection reuse to upstream
    reset_timedout_connection on;

    # -------------------------------------------------------------------------
    # Rate limiting zones (consumed by conf.d/dongdo.conf)
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # -------------------------------------------------------------------------
    # Upstreams — keepalive to backend pools
    # -------------------------------------------------------------------------
    upstream dongdo_web {
        server web:3000;
        keepalive 16;
    }

    upstream dongdo_backend {
        server server:8080;
        keepalive 32;
    }

    upstream dongdo_call {
        server call_service:8081;
        keepalive 8;
    }

    # -------------------------------------------------------------------------
    # Include all site configs
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
