# =============================================================================
# Shared SSL parameters — included by the :443 server block when SSL is on.
# =============================================================================
# This file is generated/copied into /etc/nginx/dhparam.pem via the
# docker-entrypoint.sh init step. If the file is missing, nginx -t fails
# loudly instead of silently serving weak DHE handshakes.
#
# Generate dhparam.pem once on the host (offline, ~minutes):
#   openssl dhparam -out docker/nginx/dhparam.pem 4096
#
# If you skip this step, the entrypoint script falls back to a 2048-bit
# pre-generated dhparam bundled in the image (slower TLS handshake but
# still secure). Run `make nginx-dhparam` on the host to upgrade.
# =============================================================================

# (No directives at file scope — these are referenced from dongdo.conf
# directly via ssl_dhparam. This file exists for documentation and for
# future ssl_conf_command tuning.)
