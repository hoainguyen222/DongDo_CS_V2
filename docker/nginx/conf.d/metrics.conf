# =============================================================================
# Nginx internal metrics endpoint
# =============================================================================
# Scraped by nginx-prometheus-exporter (image: nginx/nginx-prometheus-exporter)
# via the SCRAPE_URI=http://nginx:9091/stub_status env var.
#
# This block listens on :9091 inside the container network only. Do NOT
# publish this port on the host (the docker-compose.monitoring.yml handles
# this correctly by attaching the exporter via the dongdo-monitoring and
# dongdo_cs_v2_default networks rather than mapping :9091).
# =============================================================================

server {
    listen 9091;
    listen [::]:9091;
    server_name _;

    server_tokens off;
    access_log off;

    # Only nginx-prometheus-exporter inside the docker network should hit this.
    # Prometheus itself reaches the exporter, not nginx directly.
    location = /stub_status {
        stub_status on;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    location / {
        deny all;
        return 404;
    }
}
