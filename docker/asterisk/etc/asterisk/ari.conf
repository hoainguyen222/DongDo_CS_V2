;/etc/asterisk/ari.conf - ARI (Asterisk REST Interface)
;=================================================================================
; ARI exposes a JSON-RPC + WebSocket API over HTTP.  Used by:
;   - Go backend (for IVR, queue callbacks, dynamic member add/remove)
;   - External WebRTC gateways (browser → SIP via SIP.js / Janus)
;
; Password templated from ASTERISK_ARI_PASS env.  Default: dongdoari.
;=================================================================================

[general]
enabled=yes
; Bound to 0.0.0.0 inside container; restrict via compose network.
bindaddr=0.0.0.0
bindport=8088
; Pretty-print is OK in dev; off for prod
pretty=yes
; Channel substitution lets ARI replace the running dialplan branch.
; Allowed substitutions: YES everywhere we allow ARI to manipulate calls.
allowed_origins=*

; ------------------------------------------------------------------------------
; User: dongdo (ARI)
; ------------------------------------------------------------------------------
[dongdo]
type=user
read_perm=all
write_perm=all
; Password templated from $ASTERISK_ARI_PASS
secret=${ASTERISK_ARI_PASS}
; permit/deny — like manager.conf
permit=0.0.0.0/0.0.0.0
deny=0.0.0.0/0.0.0.0

; ------------------------------------------------------------------------------
; Read-only ARI user (for analytics dashboards)
; ------------------------------------------------------------------------------
[dongdo-readonly]
type=user
read_perm=all
write_perm=none
secret=${ASTERISK_ARI_READ_PASS:-dongdoread}
permit=0.0.0.0/0.0.0.0