;/etc/asterisk/rtp.conf - RTP media configuration
;=================================================================================
; Media port range must match docker-compose port mapping (10000-10100 host).
; ice_support = yes for WebRTC interop.
;=================================================================================

[general]
;
; RTP start and end ports.  Both UDP.  10000-10100 mapped to host in compose.
;
rtpstart=10000
rtpend=20000

; IPv4 only by default.  Switch to yes if IPv6 endpoints connect.
rtpchecksums=no

; ICE / STUN / TURN — supports WebRTC negotiation
icesupport=yes
stunaddr=stun.l.google.com:19302
turnaddr=turn:turn@stun.l.google.com:3478
turnusername=turn
turnpassword=turn
; Use SIP outbound to negotiate media
;
; Codecs — prefer opus → alaw → ulaw → g729
;
; (codecs live in pjsip.conf allow= list)

; DTMF mode: RFC 4733 (telephone-event) for in-band DTMF over RTP
dtmftype=rfc4733
; RTP packetisation time: 20ms is the standard balance between quality / BW
;
; QoS / DSCP tags
tos_audio=cs3
tos_video=cs4
cos_audio=3
cos_video=4