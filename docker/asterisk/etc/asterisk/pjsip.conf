;/etc/asterisk/pjsip.conf - DongDo CSKH PJSIP Configuration
;=================================================================================
; SIP endpoints for:
;   - Template (`template-dongdo`) shared by all endpoints
;   - Trunk `trunk-pstn` (outbound to mock/real PSTN gateway)
;   - Agent extensions 1001..1010 (CS agents with hardphone/softphone)
;   - Guest endpoints (dynamic registration for browser/softphone CSAT clients)
;   - ARI/Asterisk Manager user (auth not used here; AMI uses manager.conf)
;
; Secrets marked ${ASTERISK_*_PASS} are templated by entrypoint.sh from env.
; In production, set ASTERISK_GUEST_PASS and ASTERISK_AGENT_PASS_PREFIX
; via docker-compose env.  Defaults baked into image are *dev-only*.
;=================================================================================

[global]
; Allow only RFC1918 + loopback + container network; refuse the public internet.
type=global
endpoint_identifier_order=ip,username
debug=no

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Allow any peer to register (guests / browser clients). Tighten via ACL in prod.
allow_reload=yes
tos=cs3
cos=3

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2
verify_client=no
allow_reload=yes

; ------------------------------------------------------------------------------
; WebSocket transport (browser SIP clients — sip.js on the admin UI).
; WSS uses TLS on 8089 (same cert as TLS signaling); plain WS on 8088 for
; dev when the browser can hit Asterisk directly via HTTP origin.  We
; bind both so the browser can fall back to whichever port is exposed.
; ------------------------------------------------------------------------------
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
allow_reload=yes

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088
allow_reload=yes

; ------------------------------------------------------------------------------
; Endpoint template — every agent and guest inherits from this
; ------------------------------------------------------------------------------
[template-dongdo](!)
type=endpoint
context=from-internal
allow=!all,opus,alaw,ulaw,g729
disallow=all
; Prefer Opus > G.711a > G.711u > G.729
codec_prefs=opus,alaw,ulaw,g729
; WebRTC-friendly settings
webrtc=yes
use_avpf=yes
media_use_received_transport=yes
ice_support=yes
turn_port=3478
; RTP port range (must match rtp.conf)
rtp_symmetric=yes
rtp_keepalive=5
force_rport=yes
rewrite_contact=yes
moh_suggest=default
; One-touch recording for agent calls (MixMonitor)
one_touch_recording=yes
record_on_feature=automixmon
; Allow agent to be put in a queue
trust_id_inbound=yes
send_picture=yes

[auth-dongdo](!)
type=auth
auth_type=userpass
realm=dongdo.local

[aor-dongdo](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60
; Support both IPv4 and IPv6 (browser clients behind NAT)
support_path=yes
default_expiration=3600
; Allow WebSocket transport for browser clients
media_address=dynamic

; ==============================================================================
; OUTBOUND TRUNK — PSTN
; ==============================================================================
; In dev we point at a mock provider (echo service on same network).  Replace
; host, port, and credentials with real ITSP in production.
[trunk-pstn](template-dongdo)
type=endpoint
context=from-pstn
allow=alaw,ulaw,g729
disallow=all
outbound_auth=auth-trunk-pstn
aors=aor-trunk-pstn

[auth-trunk-pstn](auth-dongdo)
type=auth
username=${ASTERISK_TRUNK_USER:-mocktrunk}
password=${ASTERISK_TRUNK_PASS:-mocktrunkpass}

[aor-trunk-pstn](aor-dongdo)
type=aor
contact_user=trunk
; Static contact — no registration; ITSP expects our IP
qualify_frequency=60

; ==============================================================================
; ARI ENDPOINT — for stasis/ARI REST clients (WebRTC gateway, IVR, queue callback)
; ==============================================================================
[aor-ari](aor-dongdo)
type=aor
max_contacts=1
remove_existing=no

[ari-user](template-dongdo)
type=endpoint
context=stasis
allow=opus,alaw,ulaw
disallow=all
aors=aor-ari

; ==============================================================================
; AGENT EXTENSIONS — CS agents (sip hardphones / softphones)
; ==============================================================================
; One endpoint / auth / aor triplet per agent.  Provision more agents with:
;   ./scripts/register-agent.sh 1006

[agent-1001](template-dongdo)
type=endpoint
aors=aor-agent-1001
auth=auth-agent-1001
callerid="Agent 1001" <1001>
allow=opus,alaw,ulaw,g729
disallow=all

[auth-agent-1001](auth-dongdo)
type=auth
username=1001
password=${ASTERISK_AGENT_PASS_PREFIX:-dongdoagent}1001

[aor-agent-1001](aor-dongdo)
type=aor
max_contacts=3
remove_existing=yes

[agent-1002](template-dongdo)
type=endpoint
aors=aor-agent-1002
auth=auth-agent-1002
callerid="Agent 1002" <1002>
allow=opus,alaw,ulaw,g729
disallow=all

[auth-agent-1002](auth-dongdo)
type=auth
username=1002
password=${ASTERISK_AGENT_PASS_PREFIX:-dongdoagent}1002

[aor-agent-1002](aor-dongdo)
type=aor
max_contacts=3
remove_existing=yes

[agent-1003](template-dongdo)
type=endpoint
aors=aor-agent-1003
auth=auth-agent-1003
callerid="Agent 1003" <1003>
allow=opus,alaw,ulaw,g729
disallow=all

[auth-agent-1003](auth-dongdo)
type=auth
username=1003
password=${ASTERISK_AGENT_PASS_PREFIX:-dongdoagent}1003

[aor-agent-1003](aor-dongdo)
type=aor
max_contacts=3
remove_existing=yes

[agent-1004](template-dongdo)
type=endpoint
aors=aor-agent-1004
auth=auth-agent-1004
callerid="Agent 1004" <1004>
allow=opus,alaw,ulaw,g729
disallow=all

[auth-agent-1004](auth-dongdo)
type=auth
username=1004
password=${ASTERISK_AGENT_PASS_PREFIX:-dongdoagent}1004

[aor-agent-1004](aor-dongdo)
type=aor
max_contacts=3
remove_existing=yes

[agent-1005](template-dongdo)
type=endpoint
aors=aor-agent-1005
auth=auth-agent-1005
callerid="Agent 1005" <1005>
allow=opus,alaw,ulaw,g729
disallow=all

[auth-agent-1005](auth-dongdo)
type=auth
username=1005
password=${ASTERISK_AGENT_PASS_PREFIX:-dongdoagent}1005

[aor-agent-1005](aor-dongdo)
type=aor
max_contacts=3
remove_existing=yes

; ==============================================================================
; GUEST ENDPOINT — for browser SIP clients (JsSIP / sip.js)
; ==============================================================================
; Anonymous-ish registration: any username/password works for inbound WebRTC
; calls.  Use a long random secret in production (env ASTERISK_GUEST_PASS).
[guest](template-dongdo)
type=endpoint
context=from-guest
allow=opus,alaw,ulaw,g729
disallow=all
aors=aor-guest
auth=auth-guest
callerid="Guest" <guest>

[aor-guest](aor-dongdo)
type=aor
max_contacts=10
remove_existing=yes

[auth-guest](auth-dongdo)
type=auth
username=guest
password=${ASTERISK_GUEST_PASS:-dongdoguest}

; ==============================================================================
; IDENTIFY — match inbound from-trunk traffic to endpoint
; ==============================================================================
[identify-trunk]
type=identify
endpoint=trunk-pstn
match=0.0.0.0/0