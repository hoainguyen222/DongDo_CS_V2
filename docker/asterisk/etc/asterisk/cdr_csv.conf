;/etc/asterisk/cdr_csv.conf - CSV CDR backend
;=================================================================================
; Writes CDRs to /var/log/asterisk/cdr-csv/Master.csv.  Mount to host in compose.
;=================================================================================

[general]
; Content of CDR fields in the CSV:
; accountcode, src, dst, dcontext, clid, channel, dstchannel, lastapp,
; lastdata, start, answer, end, duration, billsec, disposition,
; amaflags, uniqueid, userfield, sequence
logfileformat=CDR

; Where to write
logdir=/var/log/asterisk/cdr-csv
; Filename pattern with strftime tokens
logfilename=Master.csv

[rotate]
; Files rotated by logrotate (out of scope inside container).
; Asterisk writes to logfilename directly; outer rotation handles rotation.