;/etc/asterisk/cel_custom.conf - Custom CEL backend (for backend integration)
;=================================================================================
; cel_custom.so emits CEL events as map[variable] = string;  Each line in
; CEL config defines (key, value) pairs to forward.
;=================================================================================

[general]

[map1]
; Map CEL events to AGI variable for easy AMI scraping
; Syntax: variable-name = CEL-field
accountcode = CHANNEL(accountcode)
calleridnum = CALLERID(num)
peer = BRIDGEPEER
exten = EXTEN