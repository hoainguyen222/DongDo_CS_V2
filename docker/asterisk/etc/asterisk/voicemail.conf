;/etc/asterisk/voicemail.conf - Voicemail box definitions
;=================================================================================
; VM boxes live under default@<exten>.  Password is templated from env.
;=================================================================================

[general]
; Default voicemail format
format=wav49|gsm|wav
; Attachment
attach=yes
; Server email — placeholder, set per-deployment
serveremail=asterisk@dongdo.local
; Mail command — disabled in container (no MTA)
mailcmd=/bin/true
; Skip greeting seconds; default 4
skipms=3000
; Max messages per inbox
maxmsg=100
; Max message length in seconds
maxsecs=180
; Delete unused greetings after
deletevoicemail=no

[default]
; 1001 .. 1010 = agent VM boxes
1001 => 1001,Agent 1001,${ASTERISK_VM_PASS}@dongdo.local
1002 => 1002,Agent 1002,${ASTERISK_VM_PASS}@dongdo.local
1003 => 1003,Agent 1003,${ASTERISK_VM_PASS}@dongdo.local
1004 => 1004,Agent 1004,${ASTERISK_VM_PASS}@dongdo.local
1005 => 1005,Agent 1005,${ASTERISK_VM_PASS}@dongdo.local
; Main queue VM
1000 => 1000,Main Queue,${ASTERISK_VM_PASS}@dongdo.local