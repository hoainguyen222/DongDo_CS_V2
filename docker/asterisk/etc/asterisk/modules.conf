;/etc/asterisk/modules.conf - DongDo CSKH module loader
;=================================================================================
; Production-grade module selection: load PJSIP (modern SIP stack), Queue, Dial,
; MixMonitor for recording, voicemail, and HTTP/ARI.  We disable legacy chan_sip
; and unused modules to reduce attack surface and startup time.
;=================================================================================

[modules]
autoload=yes

; ---- Core ----------------------------------------------------------------------
load = res_odbc.so
load = res_odbc_transaction.so
load = res_config_odbc.so
load = res_crypto.so
load = res_smdi.so
load = res_snmp.so
load = res_monitor.so

; ---- Channel drivers -----------------------------------------------------------
; chan_pjsip is the modern SIP stack (RFC 3261, RFC 7118 WebSocket, TLS).
load = chan_pjsip.so
; chan_sip is deprecated in Asterisk 20+; uncomment ONLY for legacy endpoints.
;noload = chan_sip.so

; ---- Resource modules ----------------------------------------------------------
load = res_pjsip.so
load = res_pjsip_acl.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_exten_state.so
load = res_pjsip_header_funcs.so
load = res_pjsip_logger.so
load = res_pjsip_messaging.so
load = res_pjsip_mwi_body_generator.so
load = res_pjsip_nat.so
load = res_pjsip_notify.so
load = res_pjsip_one_touch_record_info.so
load = res_pjsip_outbound_authenticator_digest.so
load = res_pjsip_outbound_registration.so
load = res_pjsip_path.so
load = res_pjsip_pidf_body_generator.so
load = res_pjsip_publish_optimizer.so
load = res_pjsip_registrar.so
load = res_pjsip_rfc3329.so
load = res_pjsip_sdp_rtp.so
load = res_pjsip_send_to_voicemail.so
load = res_pjsip_session_renegotiation.so
load = res_pjsip_simple_body_generator.so
load = res_pjsip_sips_contact.so
load = res_pjsip_t38.so
load = res_pjsip_transport_management.so
load = res_pjsip_transport_websocket.so
load = res_pjsip_voicemail.so
load = res_pjsip_xpidf_body_generator.so

; ---- RTP / Media ---------------------------------------------------------------
load = res_rtp_asterisk.so
load = res_rtp_multicast.so

; ---- CDR / CEL (Call Detail Records) -------------------------------------------
load = cdr.so
load = cel.so
load = cdr_adaptive_odbc.so
load = cdr_csv.so
load = cel_custom.so

; ---- Applications --------------------------------------------------------------
load = app_dial.so
load = app_queue.so
load = app_voicemail.so
load = app_playback.so
load = app_ivr.so
load = app_macro.so
load = app_read.so
load = app_record.so
load = app_mixmonitor.so
load = app_system.so
load = app_channelredirect.so
load = app_directed_pickup.so
load = app_pickup.so
load = app_stack.so
load = app_set_callerid.so
load = app_senddtmf.so
load = app_echo.so
load = app_wait.so
load = app_verbose.so
load = app_bridge.so
load = app_bridgewait.so
load = app_celgen.so

; ---- Format / Codec ------------------------------------------------------------
; Format modules
load = format_wav.so
load = format_gsm.so
load = format_pcm.so
load = format_sln.so
load = format_mp3.so
load = format_ogg_vorbis.so

; Codec modules — opus (WebRTC-friendly), alaw (Europe), ulaw (US/Japan), g729 (low-bandwidth)
load = codec_opus.so
load = codec_a_mu.so
load = codec_g729.so

; ---- PBX / Features ------------------------------------------------------------
load = pbx_config.so
load = func_callerid.so
load = func_cdr.so
load = func_channel.so
load = func_cut.so
load = func_logic.so
load = func_strings.so
load = func_timeout.so
load = func_db.so
load = func_shell.so

; ---- HTTP / ARI ----------------------------------------------------------------
load = res_http_websocket.so
load = res_http_post.so
load = res_ari.so
load = res_stasis.so
load = res_stasis_recording.so
load = res_stasis_snoop.so

; ---- AMI -----------------------------------------------------------------------
load = res_manager.so

; ---- Don't load these in production -------------------------------------------
noload = res_phoneprov.so
noload = res_fax.so
noload = app_fax.so