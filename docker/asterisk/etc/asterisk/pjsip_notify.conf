;/etc/asterisk/pjsip_notify.conf - Notify bodies (MWI / call-state)
;=================================================================================
; Predefined SIP NOTIFY messages (MWI etc.)
;=================================================================================

[general]

; ---- MWI for voicemail on extension 1001 ------------------------------
[mwi-1001]
event=message-summary
content-type=application/simple-message-summary
body=Messages-Waiting: yes
; Triggered by voicemail module for user 1001
var = 1001

[mwi-1002]
event=message-summary
content-type=application/simple-message-summary
body=Messages-Waiting: yes
var = 1002