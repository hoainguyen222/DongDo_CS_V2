;/etc/asterisk/musiconhold.conf - Music on hold
;=================================================================================
; Default MoH class "default" used by queues.conf.
; Loaded from container's sounds; if no sounds are bundled it falls back to
; silence (treat as null MoH).
;=================================================================================

[general]
; Use "default" class; we don't ship audio files, so silence is fine for now.
debug=no

[default]
mode=files
directory=/var/lib/asterisk/moh
; Play file in random order if multiple present
sort=random
; Format selection
format=alaw,ulaw,gsm