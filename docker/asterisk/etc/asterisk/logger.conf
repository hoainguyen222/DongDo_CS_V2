;/etc/asterisk/logger.conf - Logging configuration
;=================================================================================
; Logs are written to /var/log/asterisk (mounted to ./logs/asterisk in compose).
; messages.log is capped at 10MB; rotated by host logrotate.
;=================================================================================

[general]
dateformat=%F %T

[logfiles]
; ---- Console (captured by docker logs -f asterisk) --------------------------
console => notice,warning,error,verbose

; ---- Full debug log; truncate manually if it grows too big -----------------
; Note: very verbose; keep at "full" in dev, switch to "warning" in prod.
messages => full,debug

; ---- Full verbose to file (rotated by logrotate, off by default in prod) ---
verbose => notice,warning,error

; ---- Asterisk Manager Interface events --------------------------------------
manager => notice,warning,error

; ---- DTMF / signallling ------------------------------------------------------
dtmf => debug

; ---- CDR / Queue events -----------------------------------------------------
queue => notice,warning,error

; ---- Channel events ---------------------------------------------------------
channel => notice,warning,error

; ---- SIP signalling (PJSIP stack) -------------------------------------------
pjsip => debug,verbose
;pjsip => off

; ---- System events ---------------------------------------------------------
system => notice,warning,error

; ---- Full agent events -----------------------------------------------------
;agent => notice,warning,error,verbose
; ---- security events (auth failures etc.) ---------------------------------
security => notice,warning,error