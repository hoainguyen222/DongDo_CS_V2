;/etc/asterisk/cdr.conf - Call Detail Records (master config)
;=================================================================================
; CDR sink selection.  We use CSV (default, written to /var/log/asterisk/cdr-csv)
; AND optional ODBC if ASTERISK_CDR_ODBC_DSN is set in env.
;=================================================================================

[general]
enable=yes
unanswered=yes
; safeshutdown=yes — flush to disk on graceful shutdown
safeshutdown=yes

; CSV specifics handled by cdr_csv module (see cdr_csv.conf)
; ODBC specifics handled by cdr_adaptive_odbc (see cdr_adaptive_odbc.conf)

[csv]
usegmtime=no
loguniqueid=yes
loguserfield=yes
; writes to /var/log/asterisk/cdr-csv/Master.csv via cdr_csv.so