;/etc/asterisk/cdr_adaptive_odbc.conf - Optional ODBC CDR backend (disabled in dev)
;=================================================================================
; Uncomment & set ASTERISK_CDR_ODBC_DSN in env to write CDRs to Postgres.
; Disabled by default because it requires unixodbc + odbc-mariadb libs and
; a configured odbcinst.ini.
;=================================================================================

;[general]
;table=cdr                       ; <- adjust table name
;alias=asterisk_cdr
;connection=asterisk-postgres
;usegmtime=no
;sampleperiod=30

;[columns]
;cdr.cdr_id                      => id
;cdr.clid                        => clid
;cdr.src                         => src
;cdr.dst                         => dst
;cdr.dcontext                    => dcontext
;cdr.lastdata                    => lastdata
;cdr.start                       => start_time
;cdr.answer                      => answer_time
;cdr.end                         => end_time
;cdr.duration                    => duration
;cdr.billsec                     => billsec
;cdr.disposition                 => disposition
;cdr.amaflags                    => amaflags
;cdr.uniqueid                    => uniqueid
;cdr.sequence                    => sequence
;cdr.accountcode                 => accountcode
;cdr.userfield                   => userfield