;/etc/asterisk/manager.conf - AMI (Asterisk Manager Interface)
;=================================================================================
; AMI is the legacy but well-known control channel.  We expose it on 5038.
;
; Two users:
;   dongdo (full read/write/all)  — used by Go backend (server.go) for events
;   monitor (read-only)            — used by dashboards / analytics tools
;
; Passwords are templated from ASTERISK_AMI_PASS env var (entrypoint.sh).
; Default in dev: dongdoami / monitor.
;=================================================================================

[general]
enabled=yes
port=5038
bindaddr=0.0.0.0
; Public address reported back to AMI clients (NAT traversal)
; Default is to advertise the local IP, which works inside docker network.
; webadmin=no

; Security hardening
displayconnects=yes
;telemetry=yes
allowmultiplelogin=yes
;auto-reload=yes

; ------------------------------------------------------------------------------
; User: dongdo (admin)
; ------------------------------------------------------------------------------
[dongdo]
secret=${ASTERISK_AMI_PASS}
; Read = all "read:*" events,  Write = all action commands,  All = everything
read=all
write=all
; Allow action: originate (place outbound calls via backend)
; Allow action: redirect (move calls between contexts)
; Allow action: command (CLI exec)
; Allow action: queues (list/member/pause)
; Allow action: events (toggle event types)
; Allow action: status (channel state)
; Allow action: action_redirect
; Allow action: action_atxfer
;
; Permit from anywhere inside the docker network.
; Tighten by setting permit=10.0.0.0/8 in production.
permit=0.0.0.0/0.0.0.0
deny=0.0.0.0/0.0.0.0
; specific allows (uncomment for prod)
; permit=172.16.0.0/12.0.0.0 ; docker compose network
; permit=127.0.0.1/255.255.255.255 ; loopback

; ------------------------------------------------------------------------------
; User: monitor (read-only) for dashboards / analytics
; ------------------------------------------------------------------------------
[monitor]
secret=${ASTERISK_MONITOR_PASS:-dongdomonitor}
read=all
write=none
permit=0.0.0.0/0.0.0.0
deny=0.0.0.0/0.0.0.0

; ------------------------------------------------------------------------------
; eventfilter — only allow safe events to reduce log noise
; ------------------------------------------------------------------------------
[events]
; Send the most useful events for backend consumption.
; Excludes DTMF / signalling details to keep bandwidth low.
; (Empty filter = all events.)  Backend subscribes selectively via
; Action: Events in AMI handshake.
;# events filter syntax:
;# <header> = <on|off|off,none>
generalmessages = on
call = on
queue = on
agent = on
system = on
cdr = on
dial = on
presence = off
mwi = on
peerstatus = on