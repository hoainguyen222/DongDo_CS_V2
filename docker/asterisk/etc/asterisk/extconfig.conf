;/etc/asterisk/extconfig.conf - Optional realtime config (disabled)
;=================================================================================
; We do NOT use realtime; everything is in-file.  Keeping stub prevents
; "module load res_config_odbc.so" from crashing on empty config.
;=================================================================================

[settings]

; Uncomment to load pjsip endpoint / auth / aor tables from PostgreSQL.
; Backend would need to provision asterisk tables; out of scope for v1.

;[settings]
;ps_settings => odbc,asterisk-postgres,ps_settings
;
;[pjsip]
;ps_endpoints => odbc,asterisk-postgres,ps_endpoints
;ps_auths => odbc,asterisk-postgres,ps_auths
;ps_aors => odbc,asterisk-postgres,ps_aors
;ps_contacts => odbc,asterisk-postgres,ps_contacts
;ps_endpoint_id_ip => odbc,asterisk-postgres,ps_endpoint_id_ip

;[queue]
;queues => odbc,asterisk-postgres,queues
;queue_members => odbc,asterisk-postgres,queue_members