;/etc/asterisk/queues.conf - DongDo CSKH Queue Configuration
;=================================================================================
; Single customer-support queue: dongdo-queue
; strategy=ringall → all agents ring simultaneously
; timeout=20 → ring members for 20s before next attempt
; wrapuptime=5 → agent post-call wrap-up (5s)
; Periodic announcements let the caller know estimated wait.
;=================================================================================

[general]
autofill=yes
monitor_type=MixMonitor
; Default queue template applied to every queue without explicit field

[default](!)
musicclass=default
strategy=ringall
servicelevel=30
ringinuse=no
announce-holdtime=yes
announce-frequency=30
retry=5
timeout=15
wrapuptime=5
autofill=yes
autopause=no
setinterfacevar=yes
setqueuevar=yes
setringentryvars=no
; Default member → PJSIP/1001..1010
; Real member list defined per-queue below.

; ==============================================================================
; Main CSKH queue — 1000 calls this
; ==============================================================================
[dongdo-queue]
strategy=ringall
timeout=20
retry=5
wrapuptime=10
maxlen=0
announce-holdtime=yes
announce-frequency=30
servicelevel=30
ringinuse=no
musicclass=default
monitor_format=wav
monitor_type=MixMonitor
joinempty=yes
leavewhenempty=no
; Members: hardcoded for the 5 default agents.  Add via ARI/dynamic for prod.
member => PJSIP/1001,hint:1001@from-internal,0
member => PJSIP/1002,hint:1002@from-internal,0
member => PJSIP/1003,hint:1003@from-internal,0
member => PJSIP/1004,hint:1004@from-internal,0
member => PJSIP/1005,hint:1005@from-internal,0

; ==============================================================================
; Tier-2 escalation queue — supervisors handle overflow / VIP customers
; ==============================================================================
[dongdo-supervisor]
strategy=leastrecent
timeout=30
retry=10
wrapuptime=15
maxlen=0
announce-holdtime=yes
announce-frequency=30
servicelevel=20
musicclass=default

member =>
; populated dynamically by ARI when supervisors log in

; ==============================================================================
; Sales queue — outbound campaign
; ==============================================================================
[dongdo-sales]
strategy=roundrobin
timeout=15
retry=5
wrapuptime=30
announce-holdtime=no
musicclass=default

member =>
; populated dynamically by ARI