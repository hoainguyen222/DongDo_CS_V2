;/etc/asterisk/extensions.conf - DongDo CSKH Dialplan
;=================================================================================
; Context map:
     from-pstn  → inbound from trunk (DID routing)
     from-internal → calls originated by registered agents / guests
     from-guest → calls from browser SIP clients (WebRTC guests)
     from-queue → agent picked up via queue
     stasis    → calls routed to ARI (WebRTC, IVR, queue callback)
     macro-dial-out → reusable outbound dial helper
;=================================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no
priorityjumpother=yes
autofallthrough=yes

; ==============================================================================
; from-pstn — inbound DID from trunk-pstn
; Route "1000" → main queue.  Other DIDs could map to per-department queues.
; ==============================================================================
[from-pstn]
exten => 1000,1,NoOp(Inbound DID 1000 from ${CALLERID(num)})
 same => n,Set(CDR(inbound_did)=1000)
 same => n,Set(CDR(src)=${CALLERID(num)})
 same => n,Goto(from-pstn,1000,queue)

exten => 1000,queue,1,Answer()
 same => n,Wait(1)
 same => n,Set(CDR(userfield)=${CALLERID(num)})
 same => n,Queue(dongdo-queue,tT,,,120)
 same => n,VoiceMail(1000@default,u)
 same => n,Hangup()

exten => 1,1,NoOp(Inbound DID 1 from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Queue(dongdo-queue,tT,,,120)
 same => n,Hangup()

exten => s,1,NoOp(Anonymous inbound from ${CALLERID(num)})
 same => n,Answer()
 same => n,Goto(from-pstn,1000,queue)

; ==============================================================================
; from-internal — agents / authenticated extensions
; ==============================================================================
[from-internal]
; Service code: *97 → voicemail, *98 → check voicemail
exten => *97,1,NoOp(Agent ${CALLERID(num)} → own voicemail)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

exten => *98,1,NoOp(Agent ${CALLERID(num)} → check voicemail)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; One-touch recording toggle  *1
exten => *1,1,NoOp(Toggle MixMonitor for ${CALLERID(num)})
 same => n,Set(MONITOR_FILENAME=/var/spool/asterisk/monitor/${UNIQUEID}-${CALLERID(num)}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.wav)
 same => n,MixMonitor(${MONITOR_FILENAME},a)
 same => n,Verbose(2, MixMonitor started → ${MONITOR_FILENAME})
 same => n,Hangup()

; Exten 1000 → main inbound queue (so agents can dial 1000 to test)
exten => 1000,1,NoOp(Internal call to main queue from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Queue(dongdo-queue,tT,,,120)
 same => n,Hangup()

; Inter-agent dialing  10XX
exten => _10XX,1,NoOp(Inter-agent dial ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},60,tT)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; Outbound: any number (e.g. 84987654321) → trunk-pstn
; Pattern: 8 + 10-12 digits OR _X. (any digit string)
exten => _8X.,1,NoOp(Outbound call from ${CALLERID(num)} → ${EXTEN:1})
 same => n,Set(CDR(outbound_dst)=${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@trunk-pstn,60,tT)
 same => n,VoiceMail(${EXTEN:1}@default,u)
 same => n,Hangup()

; Fallback: anything else → queue
exten => _X.,1,NoOp(Fallback ${EXTEN} from ${CALLERID(num)} → queue)
 same => n,Answer()
 same => n,Queue(dongdo-queue,tT,,,60)
 same => n,Hangup()

; ==============================================================================
; from-guest — browser SIP clients
; WebRTC guests dial 88 → from-webrtc (Stasis/ARI).  Inter-agent dialing
; 10XX still allowed.  Block direct PSTN attempts from guests.
; ==============================================================================
[from-guest]
exten => 88,1,NoOp(Guest → WebRTC Stasis)
 same => n,Goto(from-webrtc,88,1)

exten => 1000,1,NoOp(Guest → queue)
 same => n,Answer()
 same => n,Queue(dongdo-queue,tT,,,60)
 same => n,Hangup()

exten => _10XX,1,NoOp(Guest → agent ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; Block direct PSTN attempts from guests.
exten => _8X.,1,NoOp(REJECTED guest → PSTN ${EXTEN})
 same => n,Answer()
 same => n,Playback(privacy-incorrect)
 same => n,Hangup()

exten => _X.,1,NoOp(Guest fallback ${EXTEN})
 same => n,Answer()
 same => n,Goto(from-guest,88,1)

; ==============================================================================
; from-queue — agent answered a queue call
; ==============================================================================
[from-queue]
exten => s,1,NoOp(Queue agent picked up; CONNECTEDLINE = ${CONNECTEDLINE(num)})
 same => n,Set(CDR(userfield)=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(CONNECTEDLINE(num,i)=${CALLERID(num)})
 same => n,Set(CONNECTEDLINE(name,i)=${CALLERID(name)})
 same => n,Bridge(${CONNECTEDLINE(num)})
 same => n,Hangup()

; ==============================================================================
; stasis — calls handed off to ARI (WebRTC gateway / IVR app)
; ==============================================================================
[stasis]
exten => s,1,NoOp(Stasis handoff for ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(DD_LEG=guest)
 same => n,Set(DD_SESSION_ID=${CHANNEL(linkedid)})
 same => n,Stasis(dongdo-ivr)
 same => n,Hangup()

exten => 1000,1,Goto(stasis,s,1)

; ==============================================================================
; from-webrtc — browser SIP clients (sip.js) hitting the call center
; When a browser guest dials 88, we drop them straight into the Stasis
; app with the ARI backend, which creates a fresh call record, notifies
; the agent dashboard, and waits for an agent to accept.
; ==============================================================================
[from-webrtc]
exten => 88,1,NoOp(WebRTC guest → Stasis)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(DD_LEG=guest)
 same => n,Set(DD_SESSION_ID=${CHANNEL(linkedid)})
 same => n,Stasis(dongdo-ivr)
 same => n,Hangup()

exten => s,1,Goto(from-webrtc,88,1)

exten => _X.,1,NoOp(WebRTC guest → fallback ${EXTEN})
 same => n,Goto(from-webrtc,88,1)

; ==============================================================================
; from-stasis-agent — agent leg originated by ARI after admin accepts
; ==============================================================================
[from-stasis-agent]
exten => s,1,NoOp(Agent leg entering Stasis app)
 same => n,Answer()
 same => n,Set(DD_LEG=agent)
 same => n,Set(DD_SESSION_ID=${CHANNEL(linkedid)})
 same => n,Stasis(dongdo-ivr)
 same => n,Hangup()

; ==============================================================================
; macro-dial-out — reusable outbound dial helper
; USAGE: Gosub(macro-dial-out,s,1(${TRUNK},${NUMBER},${TIMEOUT}))
; ==============================================================================
[macro-dial-out]
exten => s,1,NoOp(macro-dial-out: TRUNK=${ARG1} NUMBER=${ARG2} TIMEOUT=${ARG3:-60})
 same => n,Set(__TRUNK=${ARG1})
 same => n,Set(__NUMBER=${ARG2})
 same => n,Set(__TIMEOUT=${ARG3:-60})
 same => n,Dial(PJSIP/${NUMBER}@${TRUNK},${TIMEOUT},tT)
 same => n,Return(${DIALSTATUS})

exten => s,n,Return(FAILED)