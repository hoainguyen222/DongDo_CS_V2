;/etc/asterisk/http.conf - HTTP server for ARI + websockets
;=================================================================================
; Asterisk built-in HTTP server (handles ARI at /ari and WebSocket at /ws).
; Bound on 0.0.0.0:8088 inside container; only backend + gateway can reach it.
;=================================================================================

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
prefix=
; TLS for HTTPS ARI (optional; recommended for production).
; Uncomment + provide cert files to enable:
;tlsenable=yes
;tlsbindaddr=0.0.0.0:8089
;tlscertfile=/etc/asterisk/keys/asterisk.pem
;tlsprivatekey=/etc/asterisk/keys/asterisk.key

; ---- CORS for browser ARI clients --------------------------------------------
; Browsers can't talk ARI from a different origin; allow our web app domain.
; Wildcard is OK in dev; lock down to https://your-domain.com in prod.
allowed_origins=*

; ---- Modules served ---------------------------------------------------------
; We give ARI priority; disable admin UI to reduce attack surface.
;enable_static=yes
;enable_documentation=no
sessionlimit=1000
session_inactivity=30000
session_keepalive=15000