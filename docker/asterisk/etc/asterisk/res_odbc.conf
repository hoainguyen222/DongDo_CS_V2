;/etc/asterisk/res_odbc.conf - ODBC connections (disabled in dev)
;=================================================================================
; Activated only when ASTERISK_CDR_ODBC_DSN env is set.
;=================================================================================

;[general]
;

; ---- Example: read from .env or docker secret ---------------------------
;[asterisk-postgres]
;dsn=${ASTERISK_CDR_ODBC_DSN}     ; e.g. PG-DSN (set in /etc/odbc.ini)
;username=${ASTERISK_CDR_USER}
;password=${ASTERISK_CDR_PASS}
;pre-connect= yes
;max_connections= 10
;connect_timeout= 5
;idle_timeout= 5