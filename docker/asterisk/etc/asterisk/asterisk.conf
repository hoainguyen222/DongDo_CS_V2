;/etc/asterisk/asterisk.conf - Top-level configuration
;=================================================================================
; Astro 20 LTS main config.  All paths are container-default (/etc/asterisk,
; /var/log/asterisk, /var/spool/asterisk).  No /var paths are bind-mounted
; unless specified in docker-compose volumes.
;=================================================================================

[directories]
; Default Asterisk install layout; do NOT move these (confuses entrypoint).
astetcdir=/etc/asterisk
astmoddir=/usr/lib/asterisk/modules
astvarlibdir=/var/lib/asterisk
astdbdir=/var/lib/asterisk
astkeydir=/var/lib/asterisk
astdatadir=/var/lib/asterisk
astagidir=/var/lib/asterisk/agi
astspooldir=/var/spool/asterisk
astrundir=/var/run/asterisk
astlogdir=/var/log/asterisk

[options]
; Verbosity at startup; debug handled by logger.conf
verbose=3
debug=0
; Dump core on crash (turned off in production container)
nocolor=yes
; Dump modules in /tmp
cache_record_files=yes
; Write PID file so docker / supervisor can manage
writepid=yes
; Initial CLI key bindings — minimal
; Set max load avg before refusing new calls (defensive)
maxload=0.9
; Minimum free RAM (in MB) before refusing new calls
minmemfree=128

[compat]
; Preserves older dialplan behaviors; defaults safe for Asterisk 20.
pbx_realtime=1,1
res_ari=1,1
res_pjsip=1,1

; ------------------------------------------------------------------------------
; [files] used by `asterisk -C` validation only.
; ------------------------------------------------------------------------------
[files]
; Read these on start.  Leave defaults
; testsuite=no