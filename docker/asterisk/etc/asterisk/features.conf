;/etc/asterisk/features.conf - One-touch features (recording, transfer)
;=================================================================================
; *1 = toggle MixMonitor (one-touch record on / off)
; *2 = blind transfer
; ** = attended transfer
;=================================================================================

[general]
; Recommended elsewhere; we use featurecodes via context directives
atxfernoanswertimeout = 15
transferdelay = 3
; Pickup extension (NOTIFY-CANCEL on busy) -- unused, kept for completeness
pickupexten = *8

[featuremap]
; Default feature code mappings (in dialplan via DYNAMIC_FEATURES)
blindxfer = *2       ; Blind transfer  (during call)
atxfer = **          ; Attended transfer
disconnect = *0      ; Hang up other leg
parkcall = #72       ; Park pickup
automixmon = *1      ; Toggle MixMonitor (one-touch record)
automute = mute      ; mute (handled in app_dial_features)

[applicationmap]
[featuredigittimeout] = 1000