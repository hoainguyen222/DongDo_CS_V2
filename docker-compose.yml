services:
  # 1. PostgreSQL (Source of Truth)
  postgres:
    image: postgres:16-alpine
    container_name: dongdo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dongdo_cs
    # shared_preload_libraries is required so that pg_stat_statements
    # can be loaded as a shared library on every server start. Without
    # this line, the extension can be CREATEd but stays empty (no data
    # is collected). The query-level metrics panel in Grafana depends
    # on this.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "track_io_timing=on"
      - "-c"
      - "log_min_duration_statement=300ms"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # db/init runs on FIRST boot only (when pgdata volume is empty).
      # It executes all *.sql files in db/init sequentially — this handles the
      # initial schema creation so goose doesn't need to CREATE everything.
      #
      # KEEP THESE IN SYNC: every time you add a new migration under
      # db/migrations/, run `make sync-init` to copy it to db/init.
      # For existing volumes, goose picks up pending migrations on server startup
      # via embedded //go:embed migrations/ (no manual copy needed).
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Event Bus Streams & State)
  redis:
    image: redis:7-alpine
    container_name: dongdo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # 3. Qdrant Vector DB (RAG Knowledge Base)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dongdo_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # 4. Backend Golang Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dongdo_server
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Prometheus /metrics endpoint. Bind to 127.0.0.1 (host loopback only)
      # so it's not reachable from the public internet. The Prometheus
      # container reaches it via `host.docker.internal:9090` — see
      # monitoring/prometheus/prometheus.yml. Note: this is a DIFFERENT
      # 9090 from Prometheus's own host port; both happen to be 9090 only
      # because Prometheus publishes its own web UI on host 9090 and we
      # now add the Go server's metrics on host 9090 too — the two
      # containers are isolated, so the host loopback binds them to
      # DIFFERENT processes. To avoid any ambiguity, this maps container
      # 9090 to host 9091 (Prometheus keeps host 9090).
      - "127.0.0.1:9091:9090"
    environment:
      # /metrics must bind to 0.0.0.0 INSIDE the container so Docker's
      # published-port mapping can forward traffic to it. Override the
      # config default of 127.0.0.1:9090 here.
      METRICS_ADDR: "0.0.0.0:9090"
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/dongdo_cs?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6334"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_WORKSPACE_ID: "${ANTHROPIC_WORKSPACE_ID}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-claude-haiku-4-5-20251001}"
      LLM_TEMPERATURE: "0.1"
      DOCUMENTS_DIR: "/app/tailieu"
    volumes:
      - ./recordings:/app/recordings
      - ./tailieu:/app/tailieu
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # 5. Asterisk PBX (WebRTC, PJSIP & ARI)
  asterisk:
    build:
      context: ./services/call-service/docker/asterisk
      dockerfile: Dockerfile
    container_name: dongdo_asterisk
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Standalone WebRTC Call Service (Go Microservice)
  call_service:
    build:
      context: ./services/call-service
      dockerfile: Dockerfile
    container_name: dongdo_call_service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      CALL_SERVICE_PORT: "8081"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/dongdo_cs?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      ASTERISK_URL: "http://asterisk:8088"
      ASTERISK_USER: "asterisk"
      ASTERISK_PASS: "callservicesecretpassword"
      ASTERISK_APP: "dongdo-call-app"
    volumes:
      - ./recordings:/app/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asterisk:
        condition: service_healthy

  # 7. Next.js Frontend (Production) — reverse-proxied by nginx in production.
  # In development you run `make web-dev` (hot-reload) or `make web-run` (Docker).
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dongdo_web
    restart: unless-stopped
    # Port 3000 is for direct access without nginx (e.g. `make web-docker-run`).
    # When nginx is in front, it routes traffic to this container via the
    # Docker internal network — no host port mapping is needed.
    ports:
      - "3000:3000"
    environment:
      # Back-end URL inside the Docker network — used by Next.js rewrites to
      # proxy /api/*, /auth/* etc. to the Go server without CORS.
      BACKEND_URL: "http://server:8080"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 8. Nginx Reverse Proxy & SSL Terminator — public entry point for all services.
  # - HTTP → HTTPS redirect (when NGINX_ENABLE_SSL=true)
  # - Static assets (/_next/static/*) cached 1 year
  # - /api/*, /auth/*, /guest/*, /history/*, /chat → Go server (server:8080)
  # - /call/* → Call service (call_service:8081)
  # - /ws, /socket.io/*, /wss → Go server WebSocket upgrade
  # - /nginx-health → health check endpoint (200 OK)
  # - /metrics, /debug/pprof/* → denied (internal monitoring only)
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: dongdo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain served by this nginx. Set to your real domain in production.
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:-cskh.dongdopartners.com}"
      # Set to "true" to enable HTTPS. Also uncomment the 443 port above.
      NGINX_ENABLE_SSL: "${NGINX_ENABLE_SSL:-true}"
      # Paths to SSL certificate and key (mounted from host or secrets manager).
      SSL_CERT_PATH: "${SSL_CERT_PATH:-/etc/letsencrypt/live/cskh.dongdopartners.com/fullchain.pem}"
      SSL_KEY_PATH: "${SSL_KEY_PATH:-/etc/letsencrypt/live/cskh.dongdopartners.com/privkey.pem}"
      # Max upload size (audio files for ASR).
      UPLOAD_LIMIT: "${UPLOAD_LIMIT:-50M}"
    volumes:
      # Let's Encrypt certificates (managed by the certbot sidecar below).
      - ./docker/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./docker/nginx/certbot/www:/var/www/certbot:ro
      # Custom DH params for non-EC TLS handshakes (regenerated by Makefile).
      - ./docker/nginx/dhparam.pem:/etc/nginx/dhparam.pem:ro
    depends_on:
      - web
      - server
      - call_service
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 9. Certbot — Let's Encrypt HTTP-01 challenge + 12h renewal loop.
  # ---------------------------------------------------------------------------
  # The certbot container shares /var/www/certbot (read-only) with nginx so
  # the ACME HTTP-01 challenge handler inside dongdo.conf.template can serve
  # the validation file. Certificates live in /etc/letsencrypt on the host
  # (./docker/nginx/certbot/conf) and are bind-mounted read-only into nginx.
  #
  # First-time setup (one-off):
  #   make nginx-ssl-init   # runs the `certonly --webroot` request below
  # Renewal is automatic: the entrypoint sleeps for CERTBOT_RENEW_HOURS hours
  # (default 12) and re-runs `certbot renew` in a loop. Nginx picks up new
  # certificates on the next reload — combine with `make docker-nginx-reload`
  # in a cron or systemd timer if you want zero-downtime rotation.
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: dongdo_certbot
    restart: unless-stopped
    profiles: ["ssl"]
    volumes:
      - ./docker/nginx/certbot/conf:/etc/letsencrypt
      - ./docker/nginx/certbot/www:/var/www/certbot:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep ${CERTBOT_RENEW_HOURS:-12}h & wait $!; done'"
    environment:
      # Email used for Let's Encrypt expiry notices. CHANGE THIS.
      CERTBOT_EMAIL: "${CERTBOT_EMAIL:-ops@dongdopartners.com}"
      # Staging server for tests ("--staging"); leave unset for production.
      # CERTBOT_STAGING: "1"

volumes:
  pgdata:
  redisdata:
  qdrantdata:

networks:
  default:
    name: dongdo_cs_v2_default

