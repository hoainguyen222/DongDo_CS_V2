services:
  # 1. PostgreSQL (Source of Truth)
  postgres:
    image: postgres:16-alpine
    container_name: dongdo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dongdo_cs
    # shared_preload_libraries is required so that pg_stat_statements
    # can be loaded as a shared library on every server start. Without
    # this line, the extension can be CREATEd but stays empty (no data
    # is collected). The query-level metrics panel in Grafana depends
    # on this.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "track_io_timing=on"
      - "-c"
      - "log_min_duration_statement=300ms"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # db/init runs on FIRST boot only (when pgdata volume is empty).
      # It executes all *.sql files in db/init sequentially — this handles the
      # initial schema creation so goose doesn't need to CREATE everything.
      #
      # KEEP THESE IN SYNC: every time you add a new migration under
      # db/migrations/, run `make sync-init` to copy it to db/init.
      # For existing volumes, goose picks up pending migrations on server startup
      # via embedded //go:embed migrations/ (no manual copy needed).
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Event Bus Streams & State)
  redis:
    image: redis:7-alpine
    container_name: dongdo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # 3. Qdrant Vector DB (RAG Knowledge Base)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dongdo_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  # 4. Backend Golang Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dongdo_server
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Prometheus /metrics endpoint. Bind to 127.0.0.1 (host loopback only)
      # so it's not reachable from the public internet. The Prometheus
      # container reaches it via `host.docker.internal:9090` — see
      # monitoring/prometheus/prometheus.yml. Note: this is a DIFFERENT
      # 9090 from Prometheus's own host port; both happen to be 9090 only
      # because Prometheus publishes its own web UI on host 9090 and we
      # now add the Go server's metrics on host 9090 too — the two
      # containers are isolated, so the host loopback binds them to
      # DIFFERENT processes. To avoid any ambiguity, this maps container
      # 9090 to host 9091 (Prometheus keeps host 9090).
      - "127.0.0.1:9091:9090"
    environment:
      # /metrics must bind to 0.0.0.0 INSIDE the container so Docker's
      # published-port mapping can forward traffic to it. Override the
      # config default of 127.0.0.1:9090 here.
      METRICS_ADDR: "0.0.0.0:9090"
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/dongdo_cs?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      QDRANT_HOST: "qdrant"
      QDRANT_PORT: "6334"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_WORKSPACE_ID: "${ANTHROPIC_WORKSPACE_ID}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-claude-haiku-4-5-20251001}"
      LLM_TEMPERATURE: "0.1"
      DOCUMENTS_DIR: "/app/tailieu"
    volumes:
      - ./recordings:/app/recordings
      - ./tailieu:/app/tailieu
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # 5. Asterisk PBX (WebRTC, PJSIP & ARI)
  asterisk:
    build:
      context: ./services/call-service/docker/asterisk
      dockerfile: Dockerfile
    container_name: dongdo_asterisk
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "5060:5060/udp"
      - "10000-10200:10000-10200/udp"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Standalone WebRTC Call Service (Go Microservice)
  call_service:
    build:
      context: ./services/call-service
      dockerfile: Dockerfile
    container_name: dongdo_call_service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      CALL_SERVICE_PORT: "8081"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/dongdo_cs?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      ASTERISK_URL: "http://asterisk:8088"
      ASTERISK_USER: "asterisk"
      ASTERISK_PASS: "callservicesecretpassword"
      ASTERISK_APP: "dongdo-call-app"
    volumes:
      - ./recordings:/app/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asterisk:
        condition: service_healthy

  # 7. Next.js Frontend (Production) — served directly on port 3000.
  # An external nginx (not included in this stack) should be deployed
  # separately as a reverse proxy for HTTPS termination and SSL.
  #
  # IMPORTANT: `NEXT_PUBLIC_*` variables are inlined into the JS bundle
  # at BUILD TIME. The web/Dockerfile copies `web/.env` and sources it
  # directly in the builder stage, so build args are NOT needed here.
  # Runtime env (for `next start`) comes from `env_file: web/.env`.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dongdo_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Pass web/.env to the running container (runtime env for `next start`).
    env_file:
      - web/.env
    environment:
      # In Docker network, the Go server is reachable as `server:8080`.
      BACKEND_URL: "http://server:8080"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  qdrantdata:

networks:
  default:
    name: dongdo_cs_v2_default
