[global]
type=global
user_agent=DongDo-Asterisk-PBX

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; Default WebRTC Endpoint Template
[webrtc-endpoint](!)
type=endpoint
context=default
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
dtls_cert_file=/etc/asterisk/keys/asterisk.pem
ice_support=yes
direct_media=no
auth=webrtc-auth
aors=webrtc-aor

[webrtc-auth](!)
type=auth
auth_type=userpass
password=webrtcsecret

[webrtc-aor](!)
type=aor
max_contacts=5
remove_existing=yes

; Customer Endpoint
[customer](webrtc-endpoint)
auth=customer-auth
aors=customer-aor

[customer-auth]
type=auth
auth_type=userpass
username=customer
password=webrtcsecret

[customer-aor]
type=aor
max_contacts=10

; Agent Endpoint
[agent](webrtc-endpoint)
auth=agent-auth
aors=agent-aor

[agent-auth]
type=auth
auth_type=userpass
username=agent
password=webrtcsecret

[agent-aor]
type=aor
max_contacts=10
