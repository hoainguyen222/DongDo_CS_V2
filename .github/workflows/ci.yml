name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ============================================================
  # Backend (Go)
  # ============================================================
  backend-build:
    name: Backend - Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install sqlc
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.zip -o /tmp/sqlc.zip
          unzip -o /tmp/sqlc.zip sqlc -d tools/bin/
          chmod +x tools/bin/sqlc
          ./tools/bin/sqlc version

      - name: Install goose
        run: |
          curl -sSL https://github.com/pressly/goose/releases/download/v3.22.1/goose_linux_amd64 -o tools/bin/goose
          chmod +x tools/bin/goose
          ./tools/bin/goose --version

      - name: Generate sqlc
        run: make sqlc-gen

      - name: Verify sqlc is committed
        run: |
          if [[ -n "$(git status --porcelain internal/repository/sqlcdb/)" ]]; then
            echo "::error::Generated sqlc files are out of sync. Run 'make sqlc-gen' and commit."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  backend-test:
    name: Backend - Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: dongdo_cs_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5433/dongdo_cs_test?sslmode=disable
        run: |
          ./tools/bin/goose -dir internal/repository/postgres/migrations \
            postgres "$DATABASE_URL" up

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5433/dongdo_cs_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go test ./... -v -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        if: matrix.os != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out

  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.2
          args: --timeout=5m

  # ============================================================
  # Frontend (Next.js)
  # ============================================================
  frontend:
    name: Frontend - Lint, Type-check, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Type-check
        working-directory: web
        run: pnpm type-check

      - name: Test
        working-directory: web
        run: pnpm test --if-present

      - name: Build
        working-directory: web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080
          NEXT_PUBLIC_ADMIN_PATH: /admin

  # ============================================================
  # Docker
  # ============================================================
  docker-build:
    name: Docker - Build images
    runs-on: ubuntu-latest
    needs: [backend-build, backend-lint, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: dongdo-server:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build asterisk image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/asterisk/Dockerfile
          tags: dongdo-asterisk:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    name: Docker - Push images
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            dongdo/server:latest
            dongdo/server:${{ github.sha }}
          cache-from: type=gha

      - name: Push asterisk image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/asterisk/Dockerfile
          push: true
          tags: |
            dongdo/asterisk:latest
            dongdo/asterisk:${{ github.sha }}
          cache-from: type=gha

  # ============================================================
  # Integration tests (testcontainers)
  # ============================================================
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [backend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: |
          if [ -f Makefile ] && grep -q "test-integration" Makefile; then
            make test-integration
          else
            echo "test-integration target not defined; skipping"
          fi

  # ============================================================
  # Smoke test
  # ============================================================
  smoke-test:
    name: Smoke test (end-to-end)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          docker compose up -d
          sleep 30   # wait for services

      - name: Run smoke test
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Cleanup
        if: always()
        run: docker compose down -v
