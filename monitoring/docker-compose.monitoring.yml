# Observability / Monitoring stack for DongDo CS.
#
# This file is meant to be used together with the main docker-compose.yml:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f monitoring/docker-compose.monitoring.yml \
#     --profile monitoring up -d
#
# Every service here is gated by `profiles: ["monitoring"]` so a vanilla
# `docker compose up -d` does NOT start Prometheus / Grafana / exporters.
#
# Network design:
#   - All exporters + Prometheus + Grafana + Alertmanager live on the private
#     `dongdo-monitoring` network so they cannot reach the public internet.
#   - Exporters that need to talk to `postgres` / `redis` join a second
#     network: `dongdo_app`. When you `make up` the app stack first, that
#     network already exists (Compose creates it as `dongdo_cs_v2_default`
#     for the main project). The monitoring compose declares it as
#     `external: true` so Compose reuses it instead of failing — IF it
#     exists. If it does not exist (e.g. you run `make monitoring-up`
#     without first running `make up`), the Makefile creates a fallback
#     `dongdo_app` bridge network and Postgres / Redis exporters fall back
#     to that.
#   - The Go server's /metrics lives on the HOST loopback (published as
#     127.0.0.1:9091→container:9090 in docker-compose.yml; the container
#     binds METRICS_ADDR=0.0.0.0:9090 so Docker's port mapping works).
#     Prometheus reaches it via `host.docker.internal:9091` — Docker
#     Desktop (macOS / Windows) maps this automatically; Linux Docker
#     Engine resolves it via `extra_hosts` to the default gateway IP.
#   - nginx-exporter's :9113 is bound to 127.0.0.1 on the host too, so
#     Prometheus can scrape host.docker.internal:9113 (see the `ports:`
#     block below and prometheus.yml).
#
# SECURITY:
#   - No exporter or app port is published to a PUBLIC host address.
#     `127.0.0.1:<port>:<port>` mappings only bind to the host loopback,
#     so they are unreachable from the network. Reach Prometheus and
#     Grafana through SSH tunneling or a private VPN.
#   - The CSKH Go server's /metrics and /debug/pprof are bound to the
#     host loopback (127.0.0.1) only — Prometheus reaches /metrics via
#     `host.docker.internal` (macOS / Windows Docker Desktop) or via the
#     network gateway IP (Linux). /debug/pprof has no host publish and
#     must be reached via `ssh -L 6060:127.0.0.1:6060 user@host`.
#
# Grafana admin credentials default to admin / admin (configurable via
# env). CHANGE THEM BEFORE EXPOSING GRAFANA ANYWHERE.

services:
  # ---------------------------------------------------------------------------
  # 1. Node Exporter — host metrics (CPU, memory, disk, network, load)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: dongdo_node_exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - dongdo-monitoring
    # /proc, /sys, / are mounted read-only so node_exporter can read host
    # metrics without privileged mode. On production EC2 this works as-is.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)"
    # No ports: only Prometheus inside the monitoring network can reach it.

  # ---------------------------------------------------------------------------
  # 2. Prometheus — scrapes every exporter and the Go server's /metrics
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: dongdo_prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      dongdo-monitoring:
        aliases:
          - prometheus
      # Prometheus reaches the Go server's /metrics via
      # `host.docker.internal:9091` (see prometheus.yml job "server"),
      # so it does NOT need to join the app network. Removing it from
      # the app network keeps the monitoring project isolated from the
      # app project and removes cross-project DNS leakage.
      # The `dongdo_cs_v2_default` block below is kept as a no-op
      # (commented out) for documentation; re-enable if a future
      # exporter returns to using internal DNS names.
      # dongdo_cs_v2_default:
      #   aliases:
      #     - prometheus
    # Port 9090 is the Prometheus UI + scrape API. The Go server's
    # /metrics is published on host 127.0.0.1:9091 (see
    # docker-compose.yml); Prometheus scrapes it via
    # `host.docker.internal:9091`. Different host ports = no collision.
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    # `host.docker.internal` mapping kept for backwards-compat in case
    # any exporter still binds on the host loopback. New exporters
    # should bind inside their containers and be reached via DNS.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # 3. Alertmanager — receives alerts from Prometheus
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: dongdo_alertmanager
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - dongdo-monitoring
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  # ---------------------------------------------------------------------------
  # 4. Postgres Exporter — query-level observability (pg_stat_statements)
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: dongdo_postgres_exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      dongdo-monitoring:
        aliases:
          - postgres-exporter
      dongdo_cs_v2_default:
        aliases:
          - postgres-exporter
    environment:
      # Same DSN the server uses, but pointing at the postgres hostname on
      # the app network. Replace the password in production via .env.
      DATA_SOURCE_NAME: "postgresql://postgres:postgrespassword@postgres:5432/dongdo_cs?sslmode=disable"
      # Auto-discover pg_stat_statements. If the extension was not created
      # (e.g. on managed Postgres), the exporter still ships connection /
      # replication / lock metrics.
      PG_EXPORTER_AUTO_DISCOVER_DATABASE_OBJECTS: "true"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
      PG_EXPORTER_DISABLE_SCRAM: "false"

  # ---------------------------------------------------------------------------
  # 5. Redis Exporter — memory, commands, keyspace, stream metrics
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: dongdo_redis_exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      dongdo-monitoring:
        aliases:
          - redis-exporter
      dongdo_cs_v2_default:
        aliases:
          - redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      # Expose stream metrics (XLEN, XPENDING, consumer count, lag).
      # Pulled into Prometheus via the `redis_stream_length` etc. names.

  # ---------------------------------------------------------------------------
  # 6. nginx Exporter — connection / request metrics for the nginx proxy
  # ---------------------------------------------------------------------------
  # Reads nginx's stub_status endpoint (served on :9091 inside the nginx
  # container — see docker/nginx/conf.d/metrics.conf) and exposes
  # Prometheus metrics on :9113. The exporter joins both networks so it
  # can resolve `nginx:9091` on the app network while Prometheus scrapes
  # it as `nginx-exporter:9113` on the monitoring network.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4
    container_name: dongdo_nginx_exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      dongdo-monitoring:
        aliases:
          - nginx-exporter
      dongdo_cs_v2_default:
        aliases:
          - nginx-exporter
    environment:
      SCRAPE_URI: "http://nginx:9091/stub_status"
    # Bind :9113 to the host loopback so Prometheus can reach it via
    # host.docker.internal:9113 (see prometheus.yml). No public exposure.
    ports:
      - "127.0.0.1:9113:9113"
    # No host ports — only Prometheus inside the monitoring network reaches it.

  # ---------------------------------------------------------------------------
  # 7. Grafana — dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: dongdo_grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - dongdo-monitoring
    ports:
      # 3050 (not 3000) to avoid colliding with `npm run dev` (Next.js).
      # Override via GRAFANA_PORT env.
      - "${GRAFANA_PORT:-3050}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Bind Grafana's internal listener to all interfaces inside the container.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3050}"
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Disable telemetry / phone-home.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USAGE_STATS_ENABLED: "false"
      # Pre-install datasources/plugins at container boot. Grafana reads this
      # env and runs `grafana-cli plugins install <name>` automatically.
      # - redis-datasource: lets you run KEYS / GET / SCAN / XLEN from Explore.
      # - postgres: built-in, no install needed.
      # Override via GRAFANA_PLUGINS env if you want to add more.
      GF_INSTALL_PLUGINS: "${GRAFANA_PLUGINS:-redis-datasource}"
      # Allow datasource provisioning to add Postgres + Redis alongside
      # Prometheus. Both default to "true". Set false to keep only Prometheus.
      GRAFANA_PG_DATASOURCE: "${GRAFANA_PG_DATASOURCE:-true}"
      GRAFANA_REDIS_DATASOURCE: "${GRAFANA_REDIS_DATASOURCE:-true}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  dongdo-monitoring:
    name: dongdo-monitoring

  # The Go server's postgres + redis containers live on the network Compose
  # creates by default: `<project>_default`. The Makefile sets the project
  # name to `dongdo_cs_v2` so this network is `dongdo_cs_v2_default`.
  #
  # We declare it `external: true` so this file can run standalone ONLY when
  # the network already exists (i.e. you ran `make up` first).
  #
  # When the network does NOT exist (e.g. someone runs only this file),
  # `make monitoring-up` creates a fallback bridge named `dongdo_app` and
  # the exporter DSNs fall back to the standalone `postgres` / `redis`
  # containers (see the long-form comment at the top of this file).
  dongdo_cs_v2_default:
    name: dongdo_cs_v2_default
    external: true
