# Prometheus configuration for the DongDo CS observability stack.
#
# Scrape jobs:
#   - prometheus      : self-monitoring
#   - node            : EC2 host metrics (CPU, memory, disk, network)
#   - server          : CSKH Go server's /metrics endpoint
#   - postgres        : PostgreSQL exporter (queries, connections, locks)
#   - redis           : Redis exporter (memory, clients, commands)
#   - nginx           : nginx-prometheus-exporter (connections, requests)
#
# SECURITY: All exporters bind to the private monitoring network. Prometheus
# is the only service that needs to reach both the app network and the
# monitoring network. Grafana and Alertmanager are isolated.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: dongdo-cs
    env: production

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          component: host

  - job_name: server
    metrics_path: /metrics
    static_configs:
      # The Go server binds /metrics to 127.0.0.1:9090 inside its container
      # and Docker publishes 9090 on the host loopback. Prometheus reaches
      # it via `host.docker.internal` — Docker Desktop (macOS / Windows)
      # maps this automatically; on Linux Docker Engine, the `extra_hosts`
      # block above maps it to the default gateway. DNS resolution via
      # `server:9090` does NOT work here because `server` lives on the
      # separate `docker-compose.yml` project and is not visible to the
      # monitoring project's DNS scope.
      - targets:
          - host.docker.internal:9091
        labels:
          component: cskh-server
          service: dongdo-cs-server
    # Skip if server is not running yet (e.g. monitoring started first).
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          component: postgres

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          component: redis

  - job_name: nginx
    static_configs:
      # nginx-prometheus-exporter reads nginx's stub_status endpoint
      # (served on :9091 inside the nginx container — see
      # docker/nginx/conf.d/metrics.conf) and exposes Prometheus metrics
      # on its own :9113 port. We bind :9113 to the host loopback (see
      # the `ports:` block in docker-compose.monitoring.yml) and reach
      # it from Prometheus via `host.docker.internal` for the same DNS
      # reason as the `server` job above — `nginx-exporter` is not
      # visible to the monitoring project's DNS scope.
      - targets:
          - host.docker.internal:9113
        labels:
          component: nginx
