# Prometheus configuration for the DongDo CS observability stack.
#
# Scrape jobs:
#   - prometheus      : self-monitoring
#   - node            : EC2 host metrics (CPU, memory, disk, network)
#   - server          : CSKH Go server's /metrics endpoint
#   - postgres        : PostgreSQL exporter (queries, connections, locks)
#   - redis           : Redis exporter (memory, clients, commands)
#   - nginx           : nginx-prometheus-exporter (connections, requests)
#
# SECURITY: All exporters bind to the private monitoring network. Prometheus
# is the only service that needs to reach both the app network and the
# monitoring network. Grafana and Alertmanager are isolated.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: dongdo-cs
    env: production

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          component: host

  - job_name: server
    metrics_path: /metrics
    static_configs:
      # The Go server exposes /metrics inside its container on
      # METRICS_ADDR=0.0.0.0:9090. Prometheus joins the
      # `dongdo_cs_v2_default` network (see docker-compose.monitoring.yml)
      # so it can resolve the service name `server` directly.
      # (Earlier this used `host.docker.internal:9090`, which only works
      # when the server's /metrics is bound to the host loopback. We
      # moved that endpoint into the container, so DNS resolves it now.)
      - targets:
          - server:9090
        labels:
          component: cskh-server
          service: dongdo-cs-server
    # Skip if server is not running yet (e.g. monitoring started first).
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          component: postgres

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          component: redis

  - job_name: nginx
    static_configs:
      # nginx-prometheus-exporter reads nginx's stub_status endpoint
      # (served on :9091 inside the container — see
      # docker/nginx/conf.d/metrics.conf) and exposes Prometheus metrics
      # on its own :9113 port. The exporter service joins both the
      # dongdo-monitoring and dongdo_cs_v2_default networks so that:
      #   1. Prometheus can reach it here as `nginx-exporter:9113`.
      #   2. The exporter itself can resolve `nginx:9091` on the app
      #      network.
      - targets:
          - nginx-exporter:9113
        labels:
          component: nginx
